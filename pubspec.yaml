name: engkids
description: "EngKids — A Halloween-themed English learning app for kids ages 4-8. Kiroween 2026 entry."
publish_to: "none"

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  go_router: ^14.6.3
  google_fonts: ^6.2.1

  flutter_animate: ^4.5.2
  lottie: ^3.1.3

  audioplayers: ^6.1.0
  flutter_tts: ^4.2.5

  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#1A0030"
    theme_color: "#FF6B00"

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/audio/letters/
    - assets/images/
    - assets/images/avatars/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
